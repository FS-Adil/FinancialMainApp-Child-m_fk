services:
  redis:
    image: redis:7-alpine
    container_name: bff_m_fk-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bff_m_fk-redis-commander
    environment:
      REDIS_HOSTS: local:redis:${REDIS_PORT}:${REDIS_DATABASE}:${REDIS_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy