# ============================================
# BFF CONFIGURATION
# ============================================
server:
  port: ${SERVER_PORT}

spring:
  config:
    import: optional:file:.env[.properties]

  # Отключаем стандартную аутентификацию Spring Security
  security:
    user:
      name: ${BFF_ADMIN_LOGIN}
      password: ${BFF_ADMIN_PASSWORD}
      roles: ADMIN

  # Redis конфигурация через Lettuce
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 2000ms
      connect-timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
          time-between-eviction-runs: 30s
          enabled: false
        shutdown-timeout: 100ms
      repositories:
        enabled: false  # Отключаем Spring Data Redis репозитории



# ============================================
# APPLICATION SETTINGS
# ============================================
app:
  # Настройки cookie
  cookie:
    domain: ${COOKIE_DOMAIN}
    secure: ${COOKIE_SECURE}
    same-site: ${COOKIE_SAME_SITE}

  # Настройки сессии
  session:
    ttl-minutes: ${SESSION_TTL}
    max-concurrent-sessions: 5

  # URL микросервисов
  services:
    auth-service:
      url: ${AUTH_SERVICE_URL}
      service-token: ${AUTH_SERVICE_TOKEN}
      connect-timeout: 5000
      read-timeout: 30000
    cost-service:
      url: ${COST_SERVICE_URL}
      connect-timeout: 5000
      read-timeout: 60000

  # CORS
  cors:
    allowed-origins: ${CORS_ORIGINS}
    max-age: 3600



# ============================================
# LOGGING
# ============================================
logging:
  level:
    com.company.costbff: ${APP_LOG_LEVEL}
    org.springframework.security: ${SECURITY_LOG_LEVEL}
    org.springframework.data.redis: WARN
    io.lettuce.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"